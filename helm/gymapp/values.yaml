replicaCount: 2

image:
  repository: imanishpr/decentralised-gym
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: gymapp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

env:
  serverPort: "8080"
  datasourceUrl: jdbc:mysql://{{ include "gymapp.fullname" . }}-mysql:3306/gym?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  datasourceUsername: root
  jwtExpirationSeconds: "86400"
  googleClientId: YOUR_GOOGLE_CLIENT_ID
  facebookClientId: YOUR_FACEBOOK_CLIENT_ID
  twitterClientId: YOUR_TWITTER_CLIENT_ID

secrets:
  datasourcePassword: Sample-pass
  jwtSecret: change-this-to-a-very-long-random-secret-key-at-least-32-bytes
  googleClientSecret: YOUR_GOOGLE_CLIENT_SECRET
  facebookClientSecret: YOUR_FACEBOOK_CLIENT_SECRET
  twitterClientSecret: YOUR_TWITTER_CLIENT_SECRET

mysql:
  enabled: true
  image: mysql:8.4
  database: gym
  persistence:
    enabled: true
    size: 8Gi

startup:
  waitForMysql:
    enabled: true
    image: busybox:1.36
