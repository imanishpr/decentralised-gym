{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gymapp.fullname" . }}-mysql
  labels:
    {{- include "gymapp.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: mysql
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
{{- end }}
