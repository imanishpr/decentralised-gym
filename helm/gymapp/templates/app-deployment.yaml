apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gymapp.fullname" . }}
  labels:
    {{- include "gymapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gymapp.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gymapp.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if and .Values.mysql.enabled .Values.startup.waitForMysql.enabled }}
      initContainers:
        - name: wait-for-mysql
          image: {{ .Values.startup.waitForMysql.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z {{ include "gymapp.fullname" . }}-mysql 3306; do echo waiting for mysql; sleep 2; done
      {{- end }}
      containers:
        - name: gymapp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "gymapp.fullname" . }}-config
            - secretRef:
                name: {{ include "gymapp.fullname" . }}-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 180
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
