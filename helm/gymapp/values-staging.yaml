replicaCount: 1

image:
  repository: theprocastinator/decentralised-gym
  tag: v1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: api-staging.gymapp.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: gymapp-staging-tls
      hosts:
        - api-staging.gymapp.example.com

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 768Mi

env:
  serverPort: "8080"
  datasourceUrl: jdbc:mysql://{{ include "gymapp.fullname" . }}-mysql:3306/gym?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  datasourceUsername: root
  jwtExpirationSeconds: "86400"
  googleClientId: DISABLED_FOR_LOCAL_ARGO_SETUP
  facebookClientId: DISABLED_FOR_LOCAL_ARGO_SETUP
  twitterClientId: DISABLED_FOR_LOCAL_ARGO_SETUP

secrets:
  datasourcePassword: Sample-pass
  jwtSecret: change-this-to-a-very-long-random-secret-key-at-least-32-bytes
  googleClientSecret: DISABLED_FOR_LOCAL_ARGO_SETUP
  facebookClientSecret: DISABLED_FOR_LOCAL_ARGO_SETUP
  twitterClientSecret: DISABLED_FOR_LOCAL_ARGO_SETUP

mysql:
  enabled: true
  image: mysql:8.4
  database: gym
  persistence:
    enabled: true
    size: 10Gi
