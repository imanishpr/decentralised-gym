spring.application.name=gymapp

# MySQL datasource
SPRING_DATASOURCE_URL=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
SPRING_DATASOURCE_USERNAME=${MYSQLUSER}
SPRING_DATASOURCE_PASSWORD=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# OAuth2 - Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_SCOPE:openid,profile,email}

# OAuth2 - Facebook
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:YOUR_FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:YOUR_FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=${FACEBOOK_SCOPE:public_profile,email}

# OAuth2 - Twitter (X)
spring.security.oauth2.client.registration.twitter.client-id=${TWITTER_CLIENT_ID:YOUR_TWITTER_CLIENT_ID}
spring.security.oauth2.client.registration.twitter.client-secret=${TWITTER_CLIENT_SECRET:YOUR_TWITTER_CLIENT_SECRET}
spring.security.oauth2.client.registration.twitter.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.twitter.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.twitter.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.twitter.scope=${TWITTER_SCOPE:tweet.read,users.read,offline.access}
spring.security.oauth2.client.registration.twitter.provider=twitter
spring.security.oauth2.client.provider.twitter.authorization-uri=https://twitter.com/i/oauth2/authorize
spring.security.oauth2.client.provider.twitter.token-uri=https://api.twitter.com/2/oauth2/token
spring.security.oauth2.client.provider.twitter.user-info-uri=https://api.twitter.com/2/users/me?user.fields=id,name,username
spring.security.oauth2.client.provider.twitter.user-name-attribute=data.id

# Server
server.port=${SERVER_PORT:8080}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,env,loggers,threaddump,mappings
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# JWT
app.jwt.secret=${APP_JWT_SECRET:change-this-to-a-very-long-random-secret-key-at-least-32-bytes}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:86400}

# Booking slot configuration
app.booking.default-duration-hours=${APP_BOOKING_DEFAULT_DURATION_HOURS:1}
app.booking.allowed-duration-hours=${APP_BOOKING_ALLOWED_DURATIONS:1,2}
